# XcodeGen spec — regeneration fallback.
#
# The repo already contains a ready-to-open PatioFinder.xcodeproj. This file is
# only needed if you want to regenerate the project from scratch:
#
#   brew install xcodegen
#   xcodegen generate
#
# See https://github.com/yonaskolb/XcodeGen

name: PatioFinder
options:
  bundleIdPrefix: com.patiofinder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PatioFinder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PatioFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patiofinder.app
        INFOPLIST_FILE: PatioFinder/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
