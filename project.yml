# XcodeGen spec — source of truth for the Xcode project (household convention).
#
# After changing files or settings:  xcodegen generate
# (deploy.sh runs this automatically if XcodeGen is installed.)
#
# See https://github.com/yonaskolb/XcodeGen

name: PatioFinder
options:
  bundleIdPrefix: com.levelup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: "6A4J2GTB6F"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  PatioFinder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PatioFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levelup.patiofinder
        DEVELOPMENT_TEAM: "6A4J2GTB6F"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: PatioFinder/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
